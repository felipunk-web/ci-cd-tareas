name: CI/CD

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  deploy:
    needs: ci 
    runs-on: ubuntu-latest
    steps:
      - run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"